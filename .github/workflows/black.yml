name: Cron Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  cron-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Cron job is running"

      - name: Display date and time
        run: date

      - name: Print completion message
        run: echo "Cron job completed successfully"
