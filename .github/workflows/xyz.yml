name: Cron Job Every 5 Minutes

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  cron-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print message
        run: echo "Cron job is running every 5 minutes"

      - name: Show current date and time
        run: date

      - name: Print completion message
        run: echo "Cron job completed successfully"
